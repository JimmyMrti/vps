[defaults]
inventory            = inventaire/production.yml
roles_path           = roles
collections_path     = collections
host_key_checking    = True
interpreter_python   = auto_silent
stdout_callback      = yaml
callbacks_enabled    = profile_tasks, timer
forks                = 10
display_skipped_hosts = False
nocows               = 1

# Le mot de passe du coffre n'est jamais dans le dépôt : ce script le lit
# depuis un gestionnaire de mots de passe ou une variable d'environnement.
vault_password_file  = ../scripts/coffre-mot-de-passe.sh

# Les faits sont coûteux à collecter sur une liaison lente.
fact_caching            = jsonfile
fact_caching_connection = ../.fact_cache
fact_caching_timeout    = 3600

[ssh_connection]
# ControlMaster réduit nettement le temps d'un playbook complet.
ssh_args      = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
pipelining    = True
retries       = 3

[privilege_escalation]
become        = False
become_method = sudo
