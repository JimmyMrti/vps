---
# Algorithmes retenus.
#
# Cadre : ANSSI, « Recommandations pour un usage sécurisé d'(Open)SSH ».
# Tout ce qui repose sur SHA-1, sur des courbes non vérifiables ou sur un
# chiffrement sans authentification intégrée est écarté.

ssh_echange_cles:
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group-exchange-sha256
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512

ssh_chiffrements:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr

ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com

ssh_algorithmes_cles_hote:
  - ssh-ed25519
  - ssh-ed25519-cert-v01@openssh.com
  - rsa-sha2-512
  - rsa-sha2-256

# Destinations autorisées pour une redirection de port SSH (« ssh -L »).
#
# Le tunnel est le seul chemin d'administration de n8n, qui n'est pas exposé.
# Cette liste dit ce qu'un tunnel a le droit d'atteindre — et, en creux, que
# les bases de données ne sont pas joignables par ce moyen.
ssh_destinations_tunnel:
  - "127.0.0.1:5678"   # n8n
