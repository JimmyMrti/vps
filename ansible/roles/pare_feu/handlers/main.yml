---
- name: Recharger nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded

- name: Recharger systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Rejouer le filtrage Docker
  ansible.builtin.systemd_service:
    name: pare-feu-docker
    state: restarted
