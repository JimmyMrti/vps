# n8n — automatisation.
#
# Déployé dans /opt/vps/services/n8n/. Rien n'est construit sur la machine :
# l'image est tirée depuis le registre officiel, à une version fixée.
#
#   docker compose up -d
#
# Le service le plus exposé des trois : il exécute du code écrit dans son
# interface et détient les identifiants des services qu'il pilote. Voir
# docs/services/n8n.md pour ce que chaque durcissement empêche réellement.

x-journalisation: &journalisation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # n8n. Aucun port publié : seul Caddy le joint, par le réseau `edge`.
  # ---------------------------------------------------------------------------
  n8n:
    image: ${N8N_IMAGE:?N8N_IMAGE est requis, avec une version explicite}
    pull_policy: always
    restart: unless-stopped
    user: node

    env_file:
      # Configuration non sensible, versionnée par l'exemple à côté.
      - .env
      # Clé de chiffrement des identifiants. Fichier 0600 root:root, hors dépôt.
      # Sans elle, une sauvegarde de la base n8n est inexploitable.
      - /opt/vps/secrets/n8n/chiffrement.env

    environment:
      # --- Base de données ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/mdp_postgres

      # --- Adressage ---
      # Les valeurs viennent de .env, où les deux cas — exposé ou non — sont
      # écrits côte à côte. Voir services/n8n/.env.example.
      N8N_HOST: ${N8N_DOMAIN:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      # Deux URL distinctes, et c'est le cœur de la dissociation : les
      # adresses de webhook données aux services tiers n'ont rien à voir avec
      # celle de l'éditeur, qui reste sur la boucle locale.
      N8N_EDITOR_BASE_URL: ${N8N_URL_EDITEUR:-http://localhost:5678}
      WEBHOOK_URL: ${N8N_URL_WEBHOOK:-http://localhost:5678}/
      N8N_SECURE_COOKIE: ${N8N_COOKIE_SECURISE:-false}
      N8N_PROXY_HOPS: ${N8N_SAUTS_PROXY:-0}

      # --- Ce qu'on interdit ---
      # Plus aucune commande shell exécutable depuis un workflow.
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand"]'
      # Le code d'un nœud ne peut plus lire process.env, donc ni la clé de
      # chiffrement, ni le mot de passe de la base.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # Aucun nœud tiers installable depuis l'interface : une dépendance non
      # auditée s'exécuterait avec tous les droits de n8n.
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      # Les nœuds fichier ne voient qu'un dossier dédié, et surtout pas
      # /home/node/.n8n où vit la clé de chiffrement.
      N8N_RESTRICT_FILE_ACCESS_TO: /data/fichiers
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      # L'API publique n'est pas utilisée ; ouverte, c'est une seconde porte
      # d'entrée à surveiller.
      N8N_PUBLIC_API_DISABLED: "true"
      # n8n refuse de démarrer si son fichier de configuration est lisible par
      # d'autres que son propriétaire.
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # --- Exécution du code des workflows dans un processus séparé ---
      # Isole le code utilisateur du processus principal de n8n.
      N8N_RUNNERS_ENABLED: "true"

      # --- Historique d'exécutions ---
      # Il contient ce que les workflows manipulent, donc des données
      # personnelles. Sept jours suffisent à diagnostiquer un incident.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 5000

      # --- Bruit en moins ---
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_ONBOARDING_FLOW_DISABLED: "true"
      N8N_HIRING_BANNER_ENABLED: "false"

      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_LOG_LEVEL: info
      N8N_LOG_OUTPUT: console

    secrets:
      - mdp_postgres

    # Le seul port publié de toute la pile, et il l'est sur la boucle locale.
    #
    # Ce n'est pas la même chose que publier un port : Docker n'installe la
    # règle de redirection que pour 127.0.0.1, donc rien n'est joignable depuis
    # l'extérieur et le contournement d'UFW ne s'applique pas. C'est ce qui
    # permet le tunnel SSH, seul chemin d'accès à l'interface tant que n8n
    # n'est pas exposé :
    #
    #   ssh -L 5678:localhost:5678 ubuntu@VPS   puis   http://localhost:5678
    #
    # Condition à vérifier côté socle : net.ipv4.conf.all.route_localnet doit
    # rester à 0, sa valeur par défaut. À 1, un port publié sur 127.0.0.1
    # redevient joignable depuis le réseau.
    ports:
      - "127.0.0.1:5678:5678"

    volumes:
      - n8n_donnees:/home/node/.n8n
      - n8n_fichiers:/data/fichiers

    networks:
      # Joint sa base. Ce réseau n'a pas de route vers Internet.
      - n8n_interne
      # Sort vers Internet pour appeler les API que les workflows pilotent.
      # Réseau à lui seul : n8n ne peut donc joindre aucun autre service de la
      # machine, en particulier pas l'annuaire ni sa base.
      - n8n_sortie
      # Joignable par Caddy — À DÉCOMMENTER le jour où un webhook entrant
      # devient nécessaire, en même temps que l'adressage dans .env. Tant que
      # cette ligne est commentée, n8n n'a aucune surface publique.
      # - edge

    depends_on:
      n8n-db:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

    deploy:
      resources:
        limits:
          # n8n charge en mémoire ce que ses workflows manipulent. Sans limite,
          # un seul gros fichier fait intervenir le tueur de processus du
          # noyau, qui tue rarement le bon conteneur.
          memory: 1536M
        reservations:
          memory: 512M

    logging: *journalisation

  # ---------------------------------------------------------------------------
  # PostgreSQL dédié à n8n. Instance séparée de celle de l'annuaire : deux
  # bases dans un même serveur partagent le même rôle superutilisateur.
  # ---------------------------------------------------------------------------
  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/mdp_postgres
      # Sommes de contrôle sur les pages : une corruption silencieuse du disque
      # est détectée au lieu d'être recopiée dans les sauvegardes.
      POSTGRES_INITDB_ARGS: "--data-checksums"
      TZ: Europe/Paris

    secrets:
      - mdp_postgres

    volumes:
      - n8n_db:/var/lib/postgresql/data

    networks:
      # Uniquement le réseau interne : aucune route vers Internet.
      - n8n_interne

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Strictement ce dont le point d'entrée officiel a besoin pour créer le
      # répertoire de données puis abandonner les privilèges.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    logging: *journalisation

secrets:
  mdp_postgres:
    file: /opt/vps/secrets/n8n/mdp_postgres

volumes:
  n8n_donnees:
  n8n_fichiers:
  n8n_db:

networks:
  # Réseau du frontal — À DÉCOMMENTER avec la ligne `- edge` du service, le
  # jour de l'exposition. Laissé commenté pour que la pile démarre même si le
  # socle n'a pas encore créé ce réseau.
  # edge:
  #   external: true
  n8n_interne:
    # Pas de passerelle : les conteneurs de ce réseau ne joignent pas Internet.
    internal: true
  n8n_sortie:
    driver: bridge
