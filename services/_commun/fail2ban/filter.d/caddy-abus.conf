# Lit le journal d'acces JSON de Caddy.
#
# Le format JSON n'est pas un detail : un filtre d'expressions regulieres sur
# du texte libre casse a la premiere evolution du format de journalisation, et
# personne ne s'en apercoit avant d'en avoir besoin.
#
# Ce qui declenche : les rafales de reponses 401, 403 et 404. Un visiteur
# normal en produit quelques-unes ; un balayage d'URL en produit des dizaines
# par minute.

[Definition]

failregex = ^.*"remote_ip":"<HOST>".*"status":(?:401|403|404).*$

ignoreregex =

datepattern = "ts":{EPOCH}
