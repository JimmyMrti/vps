[caddy-abus]
enabled  = true
filter   = caddy-abus
logpath  = /var/log/caddy/acces.log
backend  = auto

# Trente reponses en erreur en une minute : ce n'est plus un visiteur qui se
# trompe d'adresse, c'est un balayage.
maxretry = 30
findtime = 60
bantime  = 1h

# Bannissement progressif : une heure la premiere fois, davantage si l'adresse
# revient. Inutile de bannir un mois quelqu'un qui a mal configure un client.
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 1w

# Voir action.d/docker-user.conf : l'action iptables standard ne bloquerait
# rien du trafic destine aux conteneurs.
banaction = docker-user

# Ne jamais se bannir soi-meme, ni bannir les reseaux Docker : les requetes
# internes entre conteneurs y transitent.
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12
