# Bannissement effectif sur le trafic destine aux conteneurs.
#
# L'action iptables standard de fail2ban insere dans la chaine INPUT. Le trafic
# vers un conteneur Docker ne passe pas par INPUT : il traverse FORWARD et les
# chaines DOCKER. Une regle posee dans INPUT ne bloque donc rien, alors que
# fail2ban affiche fierement des adresses bannies.
#
# DOCKER-USER est la chaine que Docker consulte avant ses propres regles et
# qu'il ne reecrit jamais. C'est le seul endroit ou un bannissement porte.

[Definition]

actionstart = <iptables> -N f2b-<name>
              <iptables> -A f2b-<name> -j RETURN
              <iptables> -I DOCKER-USER -p <protocol> -j f2b-<name>

actionstop  = <iptables> -D DOCKER-USER -p <protocol> -j f2b-<name>
              <iptables> -F f2b-<name>
              <iptables> -X f2b-<name>

actioncheck = <iptables> -n -L DOCKER-USER | grep -q 'f2b-<name>[ \t]'

actionban   = <iptables> -I f2b-<name> 1 -s <ip> -j DROP

actionunban = <iptables> -D f2b-<name> -s <ip> -j DROP

[Init]

iptables = iptables -w
protocol = tcp
name = default
